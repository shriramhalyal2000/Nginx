upstream backend {
    server # server1_ip:port;
    server # server2 ip:port;
}

server {
    listen 443;
    server_name backend;

    ssl_certificate # ssl sertficate dir;
    ssl_certificate_key # ssl certificate key; 

    localhost /{
        proxy_pass http://backend;
        proxy_pass_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        try_file $uri $usri/ =404;
    }
}

server{
    listen 80;
    server_name localhost;
    return_addr https://$host$$requested_uri;
}